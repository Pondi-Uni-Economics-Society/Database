name: Data repository checks

on:
  pull_request:
    paths:
      - "datasets/**"
      - "templates/dataset-deposit/**"
      - "governance/**"
      - "scripts/**"
      - ".github/workflows/data-quality.yml"

permissions:
  contents: read

jobs:
  macro-dataset:
    name: Validate macroeconomic release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit release data and schema
        run: python datasets/macroeconomic-indicators/scripts/health_check.py --source-root datasets/macroeconomic-indicators/source --compact
      - name: Run database builder and audit self-tests
        run: python -m unittest discover -s datasets/macroeconomic-indicators/tests -v
      - name: Confirm the SQLite database rebuilds
        run: python datasets/macroeconomic-indicators/scripts/build_database.py

  proposed-datasets:
    name: Check dataset deposit structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML reader
        run: python -m pip install PyYAML
      - name: Test the deposit validator
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate changed dataset deposits
        run: python scripts/validate_dataset_deposit.py --base "origin/${{ github.base_ref }}"
